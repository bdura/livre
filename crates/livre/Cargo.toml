[package]
name = "livre"
version = "0.6.0"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true

readme = "../../README.md"
description = "Livre: a type-safe PDF parser"
repository.workspace = true

license.workspace = true
keywords.workspace = true

[dependencies]
winnow = "1.0"

enum_dispatch = "0.3"

# Filtering
flate2 = "1"

paste = "1"
livre-derive = { path = "../livre-derive", version = "0.3.0" }
livre-font-data = { path = "../livre-font-data", version = "0.1.0" }
thiserror = "2.0.11"
tracing = "0.1.44"

[dev-dependencies]
rstest = "0.26"
indoc = "2"
trybuild = "1"
tracing-test = "0.2.6"
criterion = "0.8"

# Reads the documents of `LIVRE_BENCH_CORPUS`, which the dev shell sets.
[[bench]]
name = "extraction"
harness = false

# Counts the allocations of the same steps, over the same documents.
[[bench]]
name = "allocations"
harness = false
