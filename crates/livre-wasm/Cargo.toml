[package]
name = "livre-wasm"
version = "0.0.0"
description = "Browser bindings behind livre's demo page"
publish = false
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

[lib]
# `rlib` lets the native integration tests link the crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
livre = { path = "../livre" }
winnow = "1.0"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
# Must equal the `wasm-bindgen-cli` shipped by the flake's locked nixpkgs.
wasm-bindgen = "=0.2.129"

[dev-dependencies]
serde_json = "1"
