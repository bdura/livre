# The real-world PDFs the extraction benchmark runs on. Nix fetches each one
# by hash (`nix/corpus.nix`), so none of them is kept in the repository.
#
# `name` is the file name without `.pdf`; `bench` selects the entries the
# benchmark reads. Every URL names a version or a commit, so its content
# cannot change.
#
# Provenance:
#
# - The arXiv papers and `GeoTopo-book` come from the corpus of py-pdf's
#   benchmarks (https://github.com/py-pdf/benchmarks). All are pdfTeX output.
#   The papers carry pdfTeX's own object streams, and they are the ones
#   livre reads without error.
# - `GeoTopo-book` is kept because it is much slower than its size suggests.
# - `tracemonkey` comes from pdf.js's test suite. Quartz wrote it without
#   object streams: the only document from another producer.
#   `nix/corpus.nix` derives `tracemonkey-objstm` from it.

